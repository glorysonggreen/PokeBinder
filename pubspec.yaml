# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: pokebinder
description: PokeBinder — a Pokémon TCG collection manager. 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Chakra Petch (headers/labels) from Google Fonts, matching the mockup.
  google_fonts: ^6.2.1
  # Backend: auth + Postgres database for the collection, binders, decks,
  # and wishlist. See SUPABASE_SETUP.md.
  supabase_flutter: ^2.17.0
  # Picks the trainer card profile picture.
  image_picker: ^1.1.2
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/